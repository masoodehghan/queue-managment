name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: .NET tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore QueueManagement.sln

      - name: Restore tests
        run: dotnet restore QueueManagement.Tests/QueueManagement.Tests.csproj

      - name: Build solution
        run: dotnet build QueueManagement.sln --configuration Release --no-restore

      - name: Build tests
        run: dotnet build QueueManagement.Tests/QueueManagement.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: >
          dotnet test QueueManagement.Tests/QueueManagement.Tests.csproj
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --verbosity normal
