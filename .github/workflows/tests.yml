name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: .NET tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore QueueManagement.Tests/QueueManagement.Tests.csproj

      - name: Test
        run: dotnet test QueueManagement.Tests/QueueManagement.Tests.csproj --configuration Release --no-restore --verbosity normal
